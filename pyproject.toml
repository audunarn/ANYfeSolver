[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYfeSolver"
version = "0.5.0"
description = "Qualified beam and shell finite-element solver"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "threadpoolctl>=3.5",
  "ANYmaterial>=0.2,<0.3",
  "ANYmesher>=0.4,<0.6",
  "ANYfileio>=0.3.3,<0.4",
  "ANYfeSolver-results>=2.2,<3",
]

[project.optional-dependencies]
marine-excitation = ["ANYhydro>=0.1.0"]
marine-morison = ["ANYloads>=0.1.0"]
general-contact = ["ANYgeometry>=0.4.3,<0.5"]
numba = ["numba>=0.59"]
pardiso = ["pypardiso>=0.4"]
accelerated = ["numba>=0.59", "pypardiso>=0.4"]
dev = [
  "build>=1.2",
  "mpmath==1.3.0",
  "pytest>=8",
  "psutil>=5.9",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/audunarn/ANYfeSolver"
Repository = "https://github.com/audunarn/ANYfeSolver"
Issues = "https://github.com/audunarn/ANYfeSolver/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfesolver", "anyfesolver.*"]

[tool.setuptools.package-data]
anyfesolver = ["_native_guard.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The results runtime is a separately packaged distribution; its source tree is
# on the path so a checkout test run needs no editable install of either wheel.
pythonpath = ["src", "packages/results/src"]
addopts = ["-ra", "-p", "no:cacheprovider"]
filterwarnings = [
  "ignore:Legacy four-node ShellElement is a temporary rollback path:DeprecationWarning",
]
