[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYfeSolver-results"
version = "2.2.0"
description = "NumPy-only offline runtime for ANYfeSolver recovery capsules"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/audunarn/ANYfeSolver"
Repository = "https://github.com/audunarn/ANYfeSolver"
Issues = "https://github.com/audunarn/ANYfeSolver/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["anyfesolver_results", "anyfesolver_results.*"]
