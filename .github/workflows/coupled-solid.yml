name: Coupled solid

# Only one portable shard installs scikit-fem and it is not assigned the two-way shell-solid coupling
# tests, so the portable run skips most of them.
# This workflow installs the optional solid stack and runs them on both operating systems.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt

jobs:
  coupled:
    name: Coupled solid (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.13"}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: ebbe0e3b500a3f0cfcc62059c3dac4b0ac178b6c
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: b6f7cf466865b1c4c34b8e5511ace97d00290f6c
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: fb11ea83656b427485f48fca9f7306c32658a672
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYsolid
          ref: 06f3276d9207376316502aca651c3455db984104
          path: .ecosystem/ANYsolid
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install ./packages/results
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install ".ecosystem/ANYsolid[skfem]"
      - run: python -m pip check
      # The test modules use importorskip: a missing solid stack must fail here, not skip.
      - run: python -c "import anysolid.backend, skfem, mpmath, threadpoolctl"
      - name: Coupled solid tests
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: >-
          python -m pytest -q -rs tests/test_coupled_*.py
          tests/test_solid_trace_extensions.py tests/test_load_contributions.py
