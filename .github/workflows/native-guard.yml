name: Native guard

# The optional CPython 3.11 Windows extension is admitted from a wheel's RECORD only. The portable
# shards use an editable install, which falls back by design, so they cannot test the admitted backend.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt

jobs:
  wheel:
    name: Native guard wheel (windows-latest, 3.11)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: ebbe0e3b500a3f0cfcc62059c3dac4b0ac178b6c
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: b6f7cf466865b1c4c34b8e5511ace97d00290f6c
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: fb11ea83656b427485f48fca9f7306c32658a672
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install ./packages/results
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      # pythonpath is emptied so that src/ does not shadow the installed wheel.
      - name: Native guard tests on the installed wheel
        run: >-
          python -m pytest -o pythonpath= --junitxml=native-guard.xml
          tests/test_native_guard_cpp.py tests/test_native_guard_code_grammar.py
      # A missing, unbuilt or unadmitted extension skips the tests: that must fail here.
      - name: No native guard test may skip
        run: python scripts/check_no_skips.py native-guard.xml
