name: Slow tests

# Opt-in tier for single tests that need far longer than any ordinary CI test
# (marked ``@pytest.mark.slow``; skipped by default, see tests/conftest.py).
# Manual or weekly; never part of the gating Tests workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt

jobs:
  slow:
    name: Slow tests (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      Q1M_ANYMATERIAL_ROOT: ${{ github.workspace }}/.ecosystem/ANYmaterial
      Q1M_ANYGEOMETRY_ROOT: ${{ github.workspace }}/.ecosystem/ANYgeometry
      Q1M_ANYMESH_ROOT: ${{ github.workspace }}/.ecosystem/ANYmesh
      Q1M_ANYFILEIO_ROOT: ${{ github.workspace }}/.ecosystem/ANYfileIO
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: Haswell
      ANYSOLVER_GE_BEAM3_DEADLINE_SCALE: "8"
      PYTHONHASHSEED: "0"
      ANYSOLVER_RUN_SLOW: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmaterial
          ref: d8a233ef4c5e38d25dbba0eb20e6cfa8d44ec5a2
          path: .ecosystem/ANYmaterial
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYgeometry
          ref: ebbe0e3b500a3f0cfcc62059c3dac4b0ac178b6c
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYmesh
          ref: b6f7cf466865b1c4c34b8e5511ace97d00290f6c
          path: .ecosystem/ANYmesh
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: audunarn/ANYfileIO
          ref: fb11ea83656b427485f48fca9f7306c32658a672
          path: .ecosystem/ANYfileIO
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install .ecosystem/ANYmaterial .ecosystem/ANYgeometry
          .ecosystem/ANYmesh .ecosystem/ANYfileIO
      - run: python -m pip install ./packages/results
      - run: python -m pip install -e ".[dev,numba]"
      - name: Run the slow tier (one test at a time)
        run: python -m pytest -m slow --run-slow -v -p no:cacheprovider --durations=0
